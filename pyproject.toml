[project]
name = "careflow"
version = "0.1.0"
description = "CareFlow — agentic patient-access and care-coordination platform (see BUILD-SPEC.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.17",
    "mcp==2.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Built in, no plugin: a test that runs longer than this dumps every thread's stack to stderr, so a hang in CI names its own cause.
# 600, not 300 (2026-11-21): the live 200-concurrent-booking test is a SERIAL chain behind one slot row lock (about 1.4 s per attempt over the hosted CI database; 293 s in run 44737235379) and printed a harmless dump just past 300 s in an
# earlier run. Every live test is also wrapped in tests.bounds.bounded (300 s, or 900 s for that one), so a real stall still fails by its own bound and a hang past 600 s still dumps. See docs/design/ci-sharding.md.
faulthandler_timeout = 600

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends(...) in a parameter default is intended, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.security.HTTPBearer"]
