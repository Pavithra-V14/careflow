- id: model_deprecated
  severity: operational
  condition: model_dependency_health detects a vanished or changed model id
  channel:
  - admin_slack
  suppressible_by_budget: false
  metrics:
  - model_dependency_health
- id: oldest_job_stale
  severity: operational
  condition: queue_depth_and_oldest_age.oldest_age > 10 min
  channel:
  - admin_slack
  suppressible_by_budget: false
  metrics:
  - queue_depth_and_oldest_age
- id: red_flag_overdue
  severity: critical_safety
  condition: red_flag_task_overdue > 0
  channel:
  - in_app_role
  - admin_slack
