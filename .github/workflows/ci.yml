# CareFlow CI (BUILD-SPEC.md §21). GitHub Actions; no Docker anywhere (CLAUDE.md rule 12).
#
# Runs the full pytest suite on every pull request (and on pushes to main) against the hosted CI Supabase
# project, as the restricted careflow_app role: row-level security is genuinely exercised, never bypassed.
#
# ONE-TIME SETUP before the first run (it cannot be automated here because it creates a password):
#   1. Add the CI project's credentials as repository secrets, using the SAME names as .env.example:
#        SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY, SUPABASE_JWKS_URL,
#        DATABASE_URL_MIGRATOR (session pooler, port 5432), DATABASE_URL_APP (transaction pooler, 6543)
#      DATABASE_URL_APP only exists after step 2. CORS_ALLOWED_ORIGINS is not needed in CI.
#   2. Create the restricted role on the CI project from a trusted machine:
#        python scripts/create_app_role.py --env ci --env-file .env.cli
#      then copy the DATABASE_URL_APP it wrote into the repository secret.
# Until both are done, the "Apply migrations" step fails with "role careflow_app must exist".
#
# Appendix B, still unconfirmed: that the session-mode pooler's advisory lock holds from a GitHub-hosted
# runner. This workflow's migration step is that confirmation: the first green run confirms it, and the
# note in BUILD-SPEC.md should be updated then.

name: CI

on:
  # A change that touches ONLY the frontend (frontend/** and its own workflow) does not run this backend workflow: the frontend has its own (frontend.yml). A change that touches anything else
  # still runs everything. NOTE for branch protection: a frontend-only pull request never reports the required `test` check from this workflow.
  pull_request:
    paths-ignore: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths-ignore: ['frontend/**', '.github/workflows/frontend.yml']

# A newer push to the same branch supersedes an older run of it, so superseded runs stop instead of piling up. Runs of DIFFERENT
# branches still share ONE hosted CI database: each live shard below has its own, job-level group so two runs never overlap on the same shard
# (and the shards themselves are safe to run in parallel, see docs/design/ci-sharding.md). NOTE: cancelling a live job mid-run skips its fixture teardown, which can leave committed
# origin='test' rows behind in the CI project (they are tagged and harmless, and never deleted automatically).
concurrency:
  group: ci-${{ github.ref }}
  # Pull-request runs are superseded by a newer push to the same PR. A run triggered by a push to main is NEVER cancelled: cancelling one mid-test skips the live tests' teardown
  # and leaves committed rows in the shared CI database (how PR #3's main run was killed, and why its successors failed on tables they assumed were empty).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # BUILD-SPEC.md §16.5: CI secret scanning blocks a commit containing a secret. gitleaks runs INSIDE the runner as a
  # pinned, checksum-verified binary: no account, no licence key, and nothing is sent to any third-party service
  # (CLAUDE.md rule 13). It scans the whole git history, redacted in its output. Needs no repository secrets.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"  # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not just the tip

      - name: No .env file other than .env.example is tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::tracked env file(s): $bad"; exit 1; fi

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan git history for secrets
        # Exact false positives are listed by fingerprint in .gitleaksignore; anything else fails the build.
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  # The fast gate: lint, the OpenAPI snapshot and every test that needs no database or credentials. It gets NO repository secrets, so a
  # test that quietly depends on one fails here. Zero skips, like the live job.
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      - name: Lint
        run: uv run ruff check careflow tests scripts

      - name: OpenAPI snapshot is current (BUILD-SPEC.md §21)
        run: uv run python scripts/export_openapi.py --check

      - name: "Offline tests (a skipped test is a failure)"
        run: |
          set -o pipefail
          uv run pytest -v -rs --durations=25 -p no:cacheprovider --ignore-glob='*live*' --ignore=tests/test_api_role_matrix.py 2>&1 | tee pytest-offline.out
          if grep -qE "(^| )SKIPPED" pytest-offline.out; then
            echo "::error::tests were skipped; CI requires zero skips"
            exit 1
          fi

  # ---- the live gate, in parallel shards (docs/design/ci-sharding.md) ---------------------------------------------------------------------------
  #
  # Migrations are applied ONCE, by their own job, before any shard starts. The shards then run the live test files in parallel against the shared
  # CI database. That is safe only because no live test counts a table that another file commits: every whole-table count is scoped to the test's
  # own clinic, and tests/test_ci_shards.py fails the build if a file is in no shard or in two, or if an unscoped whole-table count appears.
  #
  # CONCURRENCY. Each shard has its OWN group (shard number in the name), never cancel-in-progress, so shard N of one run queues behind shard N of
  # another run instead of cancelling it. GitHub keeps ONE pending job per group: a third waiting run displaces the second, which then shows as
  # CANCELLED (never as green), so a displaced gate is re-run, not skipped. Runs of the SAME branch cancel each other through the workflow-level
  # group above (a newer commit supersedes an older run).
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: careflow-ci-database-migrate
      cancel-in-progress: false
    env:
      CAREFLOW_ENV: ci
      CAREFLOW_PROFILE: demo
      DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
      DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      - name: Apply migrations to the CI project
        run: uv run python -m careflow.migrate

      # Commits, once, the role membership the live tests use (tests/db_helpers.py). Granting it inside each test's transaction made the three
      # shards wait on each other's row locks (72 + 4 setup errors in the first sharded run). CI project only; idempotent.
      - name: Commit the migrator's SET membership of careflow_app
        run: uv run python scripts/ci_grant_set_role.py

      # Read-only stop-gap for migration 0024: no live-origin account may hold queue_worker together with another role. The CI project's tagged origin='test' fixtures are not checked.
      - name: Check that worker accounts hold queue_worker only
        run: uv run python scripts/check_worker_accounts.py --origin live

  live:
    needs: migrate
    name: live shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: careflow-ci-database-shard-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four shards since 2026-10-30 (PR #9's run measured 47:00, 46:56 and 38:32 with the role matrix at 30 minutes in shard 1, and the matrix grows with every route). The role matrix is the
          # one file split across shards: `matrix_part` is "i/n", and the root conftest.py keeps only the tests of that part (a stable hash of the test id), so the two parts together run
          # every matrix test exactly once. Each part seeds its own clinics. Every shard prints per-file times (SHARD-TIME lines) so the next rebalance uses measurements; the targets below
          # are seconds from that run (matrix parts estimated at half of a matrix grown by this batch's routes). tests/test_ci_shards.py requires every live test file to appear in
          # exactly one shard, except the matrix, which must appear as complete parts.
          - shard: 1  # about 38 min: matrix part 1 (about 1200 s) + identity 393 + rotation 260 + rules 177 + read 98 + screen 97 + binding 35 + staff roles 16
            matrix_part: "1/2"
            files: >-
              tests/test_api_role_matrix.py
              tests/test_identity_live.py
              tests/test_rules_live.py
              tests/test_api_screen_message_live.py
              tests/test_api_read_message_live.py
              tests/test_patient_binding_live.py
              tests/test_staff_roles_concurrency_live.py
              tests/test_rotation_live.py
          - shard: 2  # about 37 min: matrix part 2 (about 1200 s) + queue 370 + spend 362 + scheduling 299
            matrix_part: "2/2"
            files: >-
              tests/test_api_role_matrix.py
              tests/test_queue_live.py
              tests/test_rls_spend_and_approval_live.py
              tests/test_scheduling_live.py
          - shard: 3  # about 37 min: referrals 1097 + mpi worker 298 + triage 206 + checkpoints 204 + docs 194 + msg 193
            matrix_part: ""
            files: >-
              tests/test_api_referrals_live.py
              tests/test_rls_mpi_worker_live.py
              tests/test_rls_triage_live.py
              tests/test_rls_checkpoints_live.py
              tests/test_rls_docs_live.py
              tests/test_rls_msg_live.py
          - shard: 4  # about 31 min: screenings 495 + scheduling concurrency 492 + ai registry 199 + mpi 145 + iam audit 112 + referral hold 95 + pooler 76 + migrate 58 + mpi scheduling 58 + the small ones
            matrix_part: ""
            files: >-
              tests/test_rls_screenings_live.py
              tests/test_scheduling_concurrency_live.py
              tests/test_rls_ai_registry_live.py
              tests/test_mpi_live.py
              tests/test_rls_iam_audit_live.py
              tests/test_rls_referral_hold_live.py
              tests/test_pooler_graph_live.py
              tests/test_migrate_live.py
              tests/test_rls_mpi_scheduling_live.py
              tests/test_dead_letters_live.py
              tests/test_api_offers_live.py
              tests/test_triage_writers_live.py
              tests/test_rls_child_tables_live.py
              tests/test_api_real_token_live.py
    env:
      CAREFLOW_ENV: ci
      CAREFLOW_PROFILE: demo
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
      DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
      DATABASE_URL_APP: ${{ secrets.DATABASE_URL_APP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen

      # -v names every test as it starts (the last line of a stuck run is the stuck test); --durations=25 lists the slowest at the end;
      # faulthandler_timeout (pyproject.toml) dumps all stacks if one test runs over 300 s. A skipped test is a failure here.
      # scripts/ci_peak_connections.py samples the database's backend connections in the background and prints one PEAK-CONNECTIONS line.
      - name: "Live tests, shard ${{ matrix.shard }} (a skipped test is a failure - it means a credential or migration is missing)"
        env:
          CAREFLOW_MATRIX_PART: ${{ matrix.matrix_part }}
        run: |
          set -o pipefail
          uv run python scripts/ci_peak_connections.py --label "shard-${{ matrix.shard }}" > peak.out 2>&1 &
          sampler=$!
          status=0
          uv run pytest -v -rs --durations=25 --junitxml=shard-times.xml -p no:cacheprovider ${{ matrix.files }} 2>&1 | tee pytest.out || status=$?
          kill -TERM "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          cat peak.out
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -qE "(^| )SKIPPED" pytest.out; then
            echo "::error::tests were skipped; CI requires zero skips"
            exit 1
          fi

      # The PEAK-CONNECTIONS line is printed inside the test step above on pass or fail. This step repeats it in the job SUMMARY on every outcome (including a cancelled or timed-out
      # step, where the first print is never reached), so a passed shard's number is visible without opening the log. It never fails the shard.
      - name: "Peak connections, shard ${{ matrix.shard }}"
        if: always()
        run: |
          if [ -s peak.out ]; then
            cat peak.out
            { echo "### Peak connections, shard ${{ matrix.shard }}"; echo; echo '```'; cat peak.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no PEAK-CONNECTIONS line was produced (the sampler did not run or was killed before it printed)"
            echo "PEAK-CONNECTIONS label=shard-${{ matrix.shard }} NOT-CAPTURED" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Seconds per test FILE, from the JUnit XML, so the next rebalance of the shards starts from measurements (scripts/ci_shard_times.py; it never fails the shard).
      - name: "Per-file times, shard ${{ matrix.shard }}"
        if: always()
        run: uv run python scripts/ci_shard_times.py shard-times.xml --label "shard-${{ matrix.shard }}"

  # The single required check. It is named `test`, as before, so branch protection does not change: it passes only if EVERY shard passed.
  test:
    if: always()
    needs: [secret-scan, offline, migrate, live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded (a cancelled or skipped job is a failure)
        run: |
          echo "secret-scan: ${{ needs.secret-scan.result }}"
          echo "offline (lint, structural gate, offline tests): ${{ needs.offline.result }}"
          echo "migrate: ${{ needs.migrate.result }}"
          echo "live shards: ${{ needs.live.result }}"
          if [ "${{ needs.secret-scan.result }}" != "success" ] || [ "${{ needs.offline.result }}" != "success" ] || [ "${{ needs.migrate.result }}" != "success" ] || [ "${{ needs.live.result }}" != "success" ]; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
