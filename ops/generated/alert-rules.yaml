  severity: critical_safety
  condition: voice_safety_escalation_rate < 1.0 -- a detected red flag on a call did not trigger the safety response or nurse acknowledgment
  channel:
  - admin_slack
  - in_app_admin
  suppressible_by_budget: false
  metrics:
  - voice_safety_escalation_rate
  note: no text trail exists for a missed voice escalation the way one exists for a missed message, so this fires immediately rather than waiting for a rollup
