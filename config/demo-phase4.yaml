# DEMO ONLY - NOT A CLINICAL DECISION.
#
# Placeholder values for the Phase 4 required settings (review reason codes, deadlines, watchdog limits, canary rate, rubber-stamp thresholds, sampling rates, the label pseudonym key, the cost
# figures, the sign-in link) so the review console, the watchdog, the canaries and the cost canvas can be exercised end to end on SYNTHETIC data in the demo profile (owner decision 2026-11-06 item 1).
# Every value is an invented stand-in: none is a clinical judgment, a recommendation or a proposal for a clinic. The real values are owned by the clinic / the owner and stay unset in every other
# profile. The cost figures are zero on purpose (the demo has no commercial figure); the pseudonym key is a public placeholder, NOT a secret, and protects nothing.
#
# LOADS ONLY WHEN CAREFLOW_PROFILE=demo AND CAREFLOW_DATA_POLICY=synthetic_only AND CAREFLOW_DEMO_PHASE4=1 (careflow/demo_phase4.py). In any other profile, or with any other data policy, the
# application REFUSES TO START if CAREFLOW_DEMO_PHASE4 is set. An explicit CAREFLOW_* value in the environment always wins over a placeholder here. None of these is a default in .env or in code.
#
# DELIBERATELY ABSENT, even for demo: red-flag rules, thresholds, emergency wording, protocol cards, the accept-confidence threshold.

