- id: safety_net_failed_closed
  severity: critical_safety
  condition: safety_net_fail_closed_rate increments
  channel:
  - admin_slack
  - in_app_admin
  suppressible_by_budget: false
  metrics:
  - safety_net_fail_closed_rate
